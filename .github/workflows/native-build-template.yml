name: Native installer candidates (source-built, unsigned beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-build-template.yml'
      - 'packaging/native_inputs.py'
      - 'packaging/candidate_inventory.py'
      - 'packaging/desktop_entry.py'
      - 'slide_core/version.py'
      - 'slide_core/pdf_only_export.py'
      - 'packaging/native-sources.lock.json'
      - 'packaging/build-ffmpeg.sh'
permissions:
  contents: read
  actions: read
jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            inputs: macOS-ARM64
            lock: macos-arm64
          - os: windows-latest
            inputs: Windows-X64
            lock: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native runner architecture
        shell: python
        run: |
          import platform,sys
          assert (sys.platform=='darwin' and platform.machine()=='arm64') or (sys.platform=='win32' and platform.machine().lower() in ('amd64','x86_64'))
      - name: Install exact runtime and builder
        run: python -m pip install -r packaging/requirements-${{ matrix.lock }}.lock
      - name: Download and verify pinned FFmpeg source
        run: python packaging/native_inputs.py build/native-sources --download-ffmpeg-only
      - name: Prepare macOS assembler
        if: runner.os == 'macOS'
        run: command -v nasm || brew install nasm
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
      - name: Build pinned FFmpeg on macOS
        if: runner.os == 'macOS'
        run: bash packaging/build-ffmpeg.sh
      - name: Build pinned FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash packaging/build-ffmpeg.sh
      - uses: actions/cache@v4
        with:
          path: vendor/approved/sources
          key: corresponding-sources-${{ hashFiles('packaging/native-sources.lock.json') }}
      - name: Collect exact sources, licenses and observed inventory
        run: python packaging/native_inputs.py vendor/approved
      - name: Retain source and input evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: native-inputs-${{ matrix.inputs }}
          path: vendor/approved/
          retention-days: 14
          compression-level: 0
      - name: Build candidate and record inputs
        run: |
          python -m pip check
          python packaging/prepare_vendor.py vendor/approved --candidate
          python packaging/build_manifest.py --tools vendor/approved --mode approved --output build/build-manifest.json
          python -m PyInstaller --clean --noconfirm packaging/SlideExtractor.spec
      - name: Bundled smoke on macOS
        if: runner.os == 'macOS'
        run: |
          PATH="" QT_QPA_PLATFORM=offscreen dist/SlideExtractor.app/Contents/MacOS/SlideExtractor --smoke-report "$PWD/build/installed-smoke.json"
          codesign --verify --deep --strict dist/SlideExtractor.app
          bash packaging/build-macos-dmg.sh
      - name: Bundled smoke and installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $SavedPath = $env:PATH
          $env:PATH = ""
          $process = Start-Process -FilePath "dist/SlideExtractor/SlideExtractor.exe" -ArgumentList "--smoke-report", "$PWD/build/installed-smoke.json" -Wait -PassThru
          $env:PATH = $SavedPath
          if ($process.ExitCode -ne 0) { throw "Bundled smoke failed" }
          $env:SLIDE_APP_VERSION = python slide_core/version.py
          $env:SLIDE_BUNDLE_VERSION = python slide_core/version.py --bundle
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Verify macOS app copied from mounted DMG
        if: runner.os == 'macOS'
        run: bash packaging/check-macos-install.sh
      - name: Verify installed Windows application without elevation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python slide_core/version.py
          $installDir = Join-Path $env:RUNNER_TEMP "Slide Extractor installed"
          $setup = "dist/SlideExtractor-v$version-Setup-Windows-x64.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed" }
          $env:PATH = ""
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "$installDir/SlideExtractor.exe" -ArgumentList '--smoke-report', "$PWD/build/installer-smoke.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed application failed" }
      - name: Validate observed smoke result
        shell: python
        run: |
          import json
          from pathlib import Path
          import runpy
          for name in ('installed-smoke.json','installer-smoke.json'):
              report=json.loads((Path('build')/name).read_text())
              assert report['pdf_only_checked'] and report['output_lock_cleanup_checked'],report
              assert report['status']=='success' and report['frozen'] and report['bundled_tools_checked'] and report['version']==runpy.run_path('slide_core/version.py')['VERSION'],report
      - name: Record final bundle inventory and pending release review
        shell: python
        run: |
          import runpy,sys
          from pathlib import Path
          root=Path('dist/SlideExtractor.app' if sys.platform=='darwin' else 'dist/SlideExtractor')
          extension='.exe' if sys.platform=='win32' else ''
          ffmpeg=next(p for p in root.rglob('ffmpeg'+extension) if p.is_file() and 'tools' in p.relative_to(root).parts)
          import json
          inventory=runpy.run_path('packaging/candidate_inventory.py')['inventory'](root,runpy.run_path('slide_core/version.py')['VERSION'],extension)
          Path('build/candidate-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          errors=runpy.run_path('packaging/audit_release.py')['audit'](root,ffmpeg,Path('vendor/approved/binary-manifest.json'))
          Path('build/release-gate.txt').write_text('\n'.join(errors) or 'PRELIMINARY GATE PASSED; manual review required')
          # A candidate run measures artifacts; approval happens only after review.
          assert json.loads(Path('vendor/approved/binary-manifest.json').read_text())['public_release_approved'] is False
          print('Candidate built; public release blocked pending review:', *errors, sep='\n')
      - name: Retain candidate and evidence (does not publish a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-candidate-${{ matrix.inputs }}
          path: |
            dist/*.dmg
            dist/*Setup-Windows-x64.exe
            build/build-manifest.json
            build/installed-smoke.json
            build/installer-smoke.json
            build/release-gate.txt
            build/candidate-inventory.json
          retention-days: 14
      - name: Retain installer only for beta installation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-installer-${{ matrix.inputs }}
          path: |
            dist/*.dmg
            dist/*Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
