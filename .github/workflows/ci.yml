name: Common source tests
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-linux-aarch64-validation.lock
      - name: System test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg qpdf libegl1 libopengl0
      - name: Install fixed application and test tools
        run: |
          python -m pip install -r packaging/requirements-linux-aarch64-validation.lock pytest
          python -m pip check
      - name: Run complete suite with synthetic media
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: python -m pytest -q

  windows-export-locks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-windows-x64.lock
      - name: Install fixed test environment
        run: python -m pip install -r packaging/requirements-windows-x64.lock pytest
      - name: Reproduce output lock cleanup on Windows
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m pytest -q tests/test_export_lock_cleanup.py tests/test_pdf_only_lock_cleanup.py
      - name: Protect active cache sessions and reclaim unused cache on Windows
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m pytest -q tests/test_cache.py tests/test_cache_fast.py tests/test_cache_lifecycle.py -k "not sampling_cancel and not cached_reanalysis"
