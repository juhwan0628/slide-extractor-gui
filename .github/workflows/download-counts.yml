name: Refresh installer download counts
on:
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-counts.yml'
      - 'scripts/download_stats.py'
permissions:
  contents: read
concurrency:
  group: installer-download-counts
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count public DMG and EXE downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download_stats.py
      - name: Update counters only when values change
        run: |
          git add docs/downloads/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh installer download counts"
          git pull --rebase origin main
          git push origin HEAD:main
