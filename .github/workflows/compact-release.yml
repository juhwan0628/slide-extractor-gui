name: Consolidate published release assets
on:
  push:
    branches: [main]
    paths: [packaging/compact-release.json, .github/workflows/compact-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-assets
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preservation, upload archive and clean original support assets
        run: python packaging/compact_release.py --migrate packaging/compact-release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-release-report
          path: compact-release-report.json
